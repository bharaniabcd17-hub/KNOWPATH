    C: "A built-in Python feature"
    D: "A decorator applied with two @ signs"
  correct: "B"
  explanation: "A decorator factory is a callable that takes arguments and returns the actual decorator: @repeat(3) calls repeat(3) first to get the decorator."

- id: "q-420"
