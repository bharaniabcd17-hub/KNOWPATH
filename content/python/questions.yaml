  difficulty: 0.6
  discrimination: 0.75
  stem: "What is the output?\n```python\ndef tag(fn):\n    def wrap():\n        return '<b>' + fn() + '</b>'\n    return wrap\n\n@tag\ndef text():\n    return 'hello'\n\nprint(text())\n```"
