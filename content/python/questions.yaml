    C: "To allow the decorator to accept arguments"
    D: "To make the wrapper class-based"
  correct: "B"
  explanation: "Without functools.wraps, the wrapper replaces the original function's metadata (__name__, __doc__) with its own."

- id: "q-419"
  concept_slug: "decorators"
  type: "multiple_choice"
  difficulty: 0.55
  discrimination: 0.73
  stem: "What is a decorator factory (a decorator that takes arguments)?"
