# ── generators (q-411 to q-415) ──────────────────────────────────────────────
- id: "q-411"
  concept_slug: "generators"
  type: "multiple_choice"
  difficulty: 0.4
  discrimination: 0.68
  stem: "What keyword turns a function into a generator?"
  options:
    A: "return"
    B: "yield"
    C: "async"
    D: "generate"
  correct: "B"
  explanation: "Any function containing 'yield' becomes a generator function; calling it returns a generator object."

- id: "q-412"
  concept_slug: "generators"
  type: "multiple_choice"
  difficulty: 0.45
  discrimination: 0.70
  stem: "What is the main advantage of a generator over returning a list?"
  options:
    A: "Generators are faster for random access"
    B: "Generators are lazy: they produce values one at a time, using O(1) memory"
    C: "Generators can be indexed like lists"
    D: "Generators support sorting"
  correct: "B"
  explanation: "Generators compute values on demand; this is memory-efficient for large or infinite sequences."

- id: "q-413"
  concept_slug: "generators"
  type: "multiple_choice"
  difficulty: 0.5
  discrimination: 0.72
  stem: "What is printed?\n```python\ndef counter(n):\n    for i in range(n):\n        yield i\n\ng = counter(3)\nprint(next(g))\nprint(next(g))\n```"
  options:
    A: "0\n0"
    B: "0\n1"
    C: "1\n2"
    D: "StopIteration"
  correct: "B"
  explanation: "Each next() resumes the generator from where it paused. First yields 0, second yields 1."

- id: "q-414"
  concept_slug: "generators"
  type: "multiple_choice"
  difficulty: 0.55
  discrimination: 0.73
  stem: "What happens when a generator is exhausted and next() is called again?"
  options:
    A: "It restarts from the beginning"
    B: "It returns None"
    C: "It raises StopIteration"
    D: "It raises RuntimeError"
  correct: "C"
  explanation: "When a generator function returns (falls off the end), subsequent next() calls raise StopIteration."

- id: "q-415"
  concept_slug: "generators"
  type: "multiple_choice"
  difficulty: 0.6
  discrimination: 0.75
  stem: "What is a generator expression?"
  options:
    A: "A list comprehension wrapped in list()"
    B: "A lazy generator created with () instead of [] like (x*2 for x in range(5))"
    C: "A function that uses return instead of yield"
    D: "A decorator that makes a function lazy"
  correct: "B"
  explanation: "Generator expressions use () syntax and produce values lazily, unlike list comprehensions which build the whole list."

# ── decorators (q-416 to q-420) ──────────────────────────────────────────────
- id: "q-416"
  concept_slug: "decorators"
  type: "multiple_choice"
  difficulty: 0.4
  discrimination: 0.68
  stem: "What does the @decorator syntax do?\n```python\n@my_decorator\ndef f():\n    pass\n```"
  options:
    A: "It is equivalent to f = my_decorator(f)"
    B: "It calls f with my_decorator as an argument"
    C: "It is a comment"
    D: "It is equivalent to f.my_decorator()"
  correct: "A"
  explanation: "@my_decorator is syntactic sugar for f = my_decorator(f): the decorator receives the function and returns a replacement."

- id: "q-417"
  concept_slug: "decorators"
  type: "multiple_choice"
  difficulty: 0.45
  discrimination: 0.70
  stem: "What is printed?\n```python\ndef double(fn):\n    def wrapper(*a, **kw):\n        return fn(*a, **kw) * 2\n    return wrapper\n\n@double\ndef five():\n    return 5\n\nprint(five())\n```"
  options:
    A: "5"
    B: "10"
    C: "TypeError"
    D: "None"
  correct: "B"
  explanation: "double wraps five so that its return value is multiplied by 2: 5 * 2 = 10."

- id: "q-418"
  concept_slug: "decorators"
  type: "multiple_choice"
  difficulty: 0.5
  discrimination: 0.72
  stem: "Why should a decorator use functools.wraps(fn)?"
